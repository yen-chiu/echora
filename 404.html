<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Echora</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --fg: #26232c; --muted: #6b6577; --line: #d8d2e2; --accent: #6f38b2; --bg: #fbfafc; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #ece9f2; --muted: #9d97a9; --line: #37333f; --accent: #b19cd9; --bg: #121016; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg); padding: 2rem 1.25rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.75;
    }
    main { max-width: 30rem; width: 100%; }
    .code { font-size: clamp(3rem, 18vw, 5.5rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
    h1 { font-size: 1.1rem; margin: 1.1rem 0 .5rem; }
    p { margin: 0 0 1.4rem; color: var(--muted); font-size: .95rem; }
    .links { display: flex; flex-wrap: wrap; gap: .6rem; }
    a {
      text-decoration: none; font-size: .9rem; padding: .5rem .95rem; border-radius: 999px;
      border: 1px solid var(--line); color: var(--fg);
    }
    a.primary { background: var(--accent); border-color: transparent; color: #fff; }
    a:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>这一页不在 Echora 里。</h1>
    <p>地址可能改过，也可能只是写错了。念真还坐在原来的房间，回去接着聊就好。</p>
    <div class="links">
      <a class="primary" href="./">回到 Echora</a>
      <a href="https://yenchiu.com/">回博客</a>
    </div>
  </main>
</body>
</html>
